# aika chrony: PPS2 = F9T TIME2 1PPS timestamped by the BCM54210PE PHY (extts on /dev/ptp0),
# numbered by gpsd SHM 0 ("NMEA", noselect). MIKES NTP as fallback. Ported from Ubuntu 2026-09-13.
# maxunreach 10800 = 48 h at poll 16 s: rubidium holdover p95 79 us/day, worst 332 us/day vs MIKES median
# 0.67-0.89 ms from this site (holdover/aika-result.txt, 2026-09-13). Revisit with >= 1 week of logs.
# maxlockage 60: a pulse may pair with an NMEA sample up to 60 pulses old. The default of 2
# meant any gpsd SHM silence over ~2 s starved PPS2 as well as NMEA (10-35 times a day,
# 36-113 s each, 2026-09-21). Staleness is cheap here: the NMEA sample only fixes which
# second, and the rubidium-disciplined clock drifts ~1.7 ns over 60 s. Still fails closed --
# a truly dead NMEA starves PPS2, just after 60 s rather than 2.
refclock PHC /dev/ptp0:extpps poll 4 precision 1e-9 refid PPS2 lock NMEA maxlockage 60 prefer maxunreach 10800
refclock SHM 0 poll 4 refid NMEA noselect

# minpoll 6 maxpoll 12: chrony keeps an unreachable refclock only while its newest sample is not older than the
# oldest sample of reachable sources (64 samples x poll). maxpoll 4 ended PPS2 holdover after ~17 min on
# 2026-09-13; maxpoll 12 gives ~73 h. Trade-off: MIKES cross-checks ~hourly.
server time.mikes.fi  iburst minpoll 6 maxpoll 12
server time1.mikes.fi iburst minpoll 6 maxpoll 12
server time2.mikes.fi iburst minpoll 6 maxpoll 12

driftfile /var/lib/chrony/chrony.drift
makestep 1 3
rtcsync
dscp 48

log rawmeasurements measurements tracking refclocks
logdir /var/log/chrony

allow 192.168.9.0/24
allow 172.19.92.0/24
lock_all
maxupdateskew 100.0
