# rnx2rtkp 2.4.3 b34 static PPP for the pulse-to-GPS tie, GPS+Galileo (navsys 9).
# Used for the 2026-11-05 ESA-finals runs of the 10-19 session; see docs/pulse-to-gps-tie.md.
# Antenna paths are relative to the run directory: put igs20.atx in ./products/.
# Then: tools/rtklib-clk <out>.pos.stat -o <out>.clk --obs <obs> --after-hours 6
pos1-posmode       =ppp-static
pos1-frequency     =l1+l2
pos1-soltype       =forward
pos1-elmask        =15
pos1-snrmask_r     =off
pos1-dynamics      =off
pos1-tidecorr      =on
pos1-ionoopt       =dual-freq
pos1-tropopt       =est-ztdgrad
pos1-sateph        =precise
pos1-posopt1       =on
pos1-posopt2       =on
pos1-posopt3       =on
pos1-posopt4       =on
pos1-posopt5       =on
pos1-exclsats      =
pos2-armode        =off
out-solformat      =xyz
out-outhead        =on
out-timesys        =gpst
out-timeform       =tow
out-solstatic      =all
out-outstat        =state
ant1-postype       =rinexhead
file-satantfile    =products/igs20.atx
file-rcvantfile    =products/igs20.atx
file-eopfile       =
pos1-navsys        =9
